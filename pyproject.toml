[project]
name = "trureview"
version = "0.1.0"
description = "Consent-bounded, evidence-grounded AI Builder candidate evaluator"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40.0", "pydantic>=2.6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trureview*"]
